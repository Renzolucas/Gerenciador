spring.config.import=optional:file:.env[.properties]

# URL do banco
spring.datasource.url=${DATABASE_URL}

# Login
spring.datasource.username=${DATA_USER}
spring.datasource.password=${DATA_PASSWORD}

# Configurações de banco
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#MAXIMO DE PESSOAS FAZENDO A MESMA REQUISIÇÃO
spring.datasource.hikari.maximum-pool-size=5
#MAMIXO DE TEMPO QUE A PESSOA PODE FICAR NA FILA ESPERANDO PARA FAZER REQUIÇÃO 30SEGUNDOS
spring.datasource.hikari.connection-timeout=30000